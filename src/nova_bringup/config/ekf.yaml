# robot_localization EKF: wheel odometry only (vx, vyaw) - this robot has no IMU.
# Output: odom -> base_footprint TF and /odom (remapped from odometry/filtered).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # wheel odometry from nova_base (remapped to wheel/odom when the EKF runs)
    odom0: wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
